<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marqab">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Marqab</title>
<style>
  :root {
    --bg: #F6F5F1; --card: #FFFFFF; --line: #E7E5DF; --chip: #ECEAE4;
    --accent: #5B7A99; --soft: #EEF2F6; --text: #23272E; --muted: #8A8F98;
    --warn: #D4A15A; --bad: #C8695F;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.4;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 18px calc(env(safe-area-inset-bottom, 0px) + 32px);
    -webkit-user-select: none; user-select: none;
    overscroll-behavior-y: contain;
  }
  input { -webkit-user-select: text; user-select: text; font-family: inherit; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 460px; margin: 0 auto; }
  .hidden { display: none !important; }

  header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  h1 span { font-weight: 400; }
  .month { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .gear { background: none; border: none; color: var(--muted); padding: 6px; border-radius: 10px; }
  .gear:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tabs { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; margin-bottom: 16px; }
  .tab { flex: 1; background: none; border: none; color: var(--muted); padding: 9px; border-radius: 10px; font-size: 14px; font-weight: 500; }
  .tab.on { background: var(--card); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(35,39,46,.08); }

  .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 14px; }
  .label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; margin-bottom: 8px; }

  .amount {
    width: 100%; border: none; border-bottom: 1px solid var(--line); background: transparent;
    color: var(--text); font-size: 46px; font-weight: 700; text-align: center; padding: 4px 0 12px; outline: none;
  }
  .amount:focus { border-color: var(--accent); }
  .amount::placeholder { color: #C9CCD1; }
  .note { width: 100%; margin-top: 14px; background: var(--bg); border: none; border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--text); outline: none; }
  .note::placeholder { color: var(--muted); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .cat { background: var(--bg); border: 1px solid transparent; border-radius: 14px; padding: 14px 8px; font-size: 15px; font-weight: 500; color: var(--text); transition: background .15s, border-color .15s; }
  .cat.sel { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .cat:active { transform: scale(.97); }

  .primary { width: 100%; margin-top: 14px; border: none; border-radius: 14px; background: var(--text); color: #fff; padding: 16px; font-size: 15px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
  .primary:active { opacity: .85; }
  .primary:disabled { opacity: .45; }
  .msg { text-align: center; font-size: 13px; color: var(--accent); min-height: 20px; margin: 10px 0 4px; }
  .msg.err { color: var(--bad); }

  .total { font-size: 34px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 16px; }
  .pot { margin-bottom: 14px; }
  .pot:last-child { margin-bottom: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .row .left { color: var(--muted); font-size: 13px; }
  .bar { height: 6px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width .35s ease; }
  .fill.warn { background: var(--warn); }
  .fill.bad { background: var(--bad); }

  .recent-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .ghost { background: var(--bg); border: none; color: var(--muted); border-radius: 10px; padding: 6px 12px; font-size: 13px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .item small { display: block; color: var(--muted); font-size: 12px; }
  .item b { font-weight: 700; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

  .prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .prow input { width: 120px; background: var(--bg); border: none; border-radius: 10px; padding: 9px 12px; font-size: 16px; text-align: right; color: var(--text); outline: none; }
  .prow input:focus { box-shadow: 0 0 0 1px var(--accent); }
  .sumrow { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .sumrow span { color: var(--muted); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; background: var(--bg); border: none; border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--text); outline: none; }
  .help { color: var(--muted); font-size: 13px; margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- First-time setup -->
  <section id="setup" class="hidden">
    <header><div><h1>MARQAB <span>BUDGET</span></h1><div class="month">Connect your sheet</div></div></header>
    <div class="card">
      <div class="field"><label for="cfgUrl">App link from Apps Script</label>
        <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>
      <div class="field"><label for="cfgKey">Secret code</label>
        <input id="cfgKey" type="password" placeholder="sb-…" autocomplete="off"></div>
      <button class="primary" id="cfgSave">Connect</button>
      <div class="msg" id="cfgMsg"></div>
      <p class="help">Saved on this phone only. You’ll only need to do this once.</p>
    </div>
  </section>

  <!-- Main app -->
  <section id="app" class="hidden">
    <header>
      <div><h1>MARQAB <span>BUDGET</span></h1><div class="month" id="month"></div></div>
      <button class="gear" id="gear" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab on" id="tTrack" role="tab">Track</button>
      <button class="tab" id="tPlan" role="tab">Plan</button>
    </div>

    <div id="trackView">
      <div class="card">
        <input id="amt" class="amount" type="number" inputmode="decimal" placeholder="0" aria-label="Amount in SAR">
        <input id="note" class="note" placeholder="Note (optional)">
        <div class="grid" id="cats"></div>
        <button class="primary" id="deduct">Deduct</button>
      </div>
      <div class="msg" id="msg" role="status"></div>

      <div class="card">
        <div class="label">Left this month</div>
        <div class="total" id="total">–</div>
        <div id="pots"></div>
      </div>

      <div class="card">
        <div class="recent-head"><div class="label" style="margin:0">Recent</div><button class="ghost" id="undo">Undo last</button></div>
        <div id="recent"></div>
      </div>
    </div>

    <div id="planView" class="hidden">
      <div class="card">
        <div class="label" id="planTitle">Plan this month</div>
        <div id="planRows"></div>
        <div class="prow"><b>Available</b><input id="avail" type="number" inputmode="decimal"></div>
        <div class="sumrow" style="margin-top:12px"><span>Total planned</span><b id="pTotal">0</b></div>
        <div class="sumrow"><span>Not planned yet</span><b id="pLeft">0</b></div>
        <button class="primary" id="savePlan">Save plan</button>
      </div>
      <div class="msg" id="pmsg" role="status"></div>
    </div>
  </section>

</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
    del(k) { try { localStorage.removeItem(k); } catch (_) {} }
  };

  let cfg = store.get('sb-config');
  let data = store.get('sb-cache');
  let selected = null;

  // ---------- API ----------
  async function api(action, extra) {
    const res = await fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ key: cfg.key, action: action }, extra || {}))
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Something went wrong');
    return j.data;
  }

  // ---------- Setup ----------
  function showSetup() {
    $('app').classList.add('hidden');
    $('setup').classList.remove('hidden');
    if (cfg) { $('cfgUrl').value = cfg.url; $('cfgKey').value = cfg.key; }
  }
  $('cfgSave').onclick = async () => {
    const url = $('cfgUrl').value.trim(), key = $('cfgKey').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(url)) return setMsg('cfgMsg', 'Paste the link that ends in /exec', true);
    if (!key) return setMsg('cfgMsg', 'Type your secret code', true);
    cfg = { url: url, key: key };
    $('cfgSave').disabled = true; setMsg('cfgMsg', 'Connecting…');
    try {
      const d = await api('summary');
      store.set('sb-config', cfg);
      $('cfgSave').disabled = false; setMsg('cfgMsg', '');
      startApp(d);
    } catch (e) {
      $('cfgSave').disabled = false;
      setMsg('cfgMsg', e.message === 'Wrong code' ? 'That code doesn’t match the one in Api.gs' : 'Couldn’t connect. Check the link and that the deployment is set to Anyone.', true);
    }
  };
  $('gear').onclick = () => { if (confirm('Change the app link or secret code?')) showSetup(); };

  // ---------- Rendering ----------
  function setMsg(id, t, err) { const el = $(id); el.textContent = t; el.classList.toggle('err', !!err); }

  function render(d) {
    if (!d) return;
    data = d; store.set('sb-cache', d);
    const cats = $('cats');
    if (cats.children.length !== d.cats.length) {
      cats.innerHTML = '';
      d.cats.forEach(c => {
        const b = document.createElement('button');
        b.className = 'cat' + (c.name === selected ? ' sel' : '');
        b.textContent = c.name;
        b.onclick = () => {
          selected = c.name;
          cats.querySelectorAll('.cat').forEach(x => x.classList.toggle('sel', x === b));
        };
        cats.appendChild(b);
      });
    }
    let total = 0;
    $('pots').innerHTML = d.cats.map(c => {
      total += Number(c.left);
      const pct = c.budget > 0 ? Math.min(100, Math.max(0, (c.spent / c.budget) * 100)) : 0;
      const cls = pct >= 100 ? 'bad' : pct >= 80 ? 'warn' : '';
      return `<div class="pot"><div class="row"><span>${esc(c.name)}</span><span class="left">${fmt(c.left)} left of ${fmt(c.budget)}</span></div>
        <div class="bar"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
    }).join('');
    $('total').textContent = fmt(total) + ' SAR';
    $('recent').innerHTML = d.recent && d.recent.length
      ? d.recent.map(r => `<div class="item"><div>${esc(r.cat)}<small>${esc(r.date)}${r.note ? ', ' + esc(r.note) : ''}</small></div><b>−${fmt(r.amt)}</b></div>`).join('')
      : '<div class="empty">Nothing logged this month yet.</div>';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

  // ---------- Deduct (instant) ----------
  $('deduct').onclick = () => {
    const amt = Number($('amt').value), note = $('note').value.trim();
    if (!(amt > 0) || !selected) return setMsg('msg', 'Type an amount and pick a category', true);
    if (!data) return setMsg('msg', 'Still loading, try again in a second', true);
    const cat = selected;
    const before = JSON.parse(JSON.stringify(data));
    const d = JSON.parse(JSON.stringify(data));
    const c = d.cats.find(x => x.name === cat);
    c.spent = Number(c.spent) + amt;
    c.left = Number(c.left) - amt;
    d.recent = [{ date: 'Just now', cat: cat, amt: amt, note: note }].concat(d.recent || []).slice(0, 10);
    render(d);
    setMsg('msg', `Done ✓  ${fmt(c.left)} SAR left in ${cat}`);
    if (navigator.vibrate) navigator.vibrate(15);
    $('amt').value = ''; $('note').value = ''; $('amt').blur();
    api('add', { category: cat, amount: amt, note: note })
      .then(fresh => { if (fresh) render(fresh); })
      .catch(e => { render(before); setMsg('msg', 'Not saved: ' + e.message + '. Check your internet and try again.', true); });
  };

  $('undo').onclick = async () => {
    if (!confirm('Remove the last entry?')) return;
    setMsg('msg', 'Removing…');
    try { render(await api('undo')); setMsg('msg', 'Last entry removed'); }
    catch (e) { setMsg('msg', 'Couldn’t remove it: ' + e.message, true); }
  };

  // ---------- Plan ----------
  function show(view) {
    const plan = view === 'plan';
    $('trackView').classList.toggle('hidden', plan);
    $('planView').classList.toggle('hidden', !plan);
    $('tTrack').classList.toggle('on', !plan);
    $('tPlan').classList.toggle('on', plan);
    if (plan) loadPlan();
  }
  $('tTrack').onclick = () => show('track');
  $('tPlan').onclick = () => show('plan');

  async function loadPlan() {
    setMsg('pmsg', 'Loading…');
    try {
      const p = await api('getPlan');
      $('planTitle').textContent = 'Plan for ' + p.month;
      $('planRows').innerHTML = p.cats.map(c =>
        `<div class="prow"><span>${esc(c.name)}</span><input class="pin" type="number" inputmode="decimal" value="${c.amount}"></div>`).join('');
      $('avail').value = p.available;
      document.querySelectorAll('.pin').forEach(i => i.oninput = planTotals);
      setMsg('pmsg', ''); planTotals();
    } catch (e) { setMsg('pmsg', 'Couldn’t load the plan: ' + e.message, true); }
  }
  $('avail').oninput = planTotals;
  function planTotals() {
    const total = [...document.querySelectorAll('.pin')].reduce((s, i) => s + (Number(i.value) || 0), 0);
    const left = (Number($('avail').value) || 0) - total;
    $('pTotal').textContent = fmt(total) + ' SAR';
    $('pLeft').textContent = fmt(left) + ' SAR';
    $('pLeft').style.color = left < 0 ? 'var(--bad)' : 'var(--text)';
  }
  $('savePlan').onclick = async () => {
    $('savePlan').disabled = true; setMsg('pmsg', 'Saving…');
    try {
      const amounts = [...document.querySelectorAll('.pin')].map(i => i.value);
      render(await api('savePlan', { amounts: amounts, available: $('avail').value }));
      setMsg('pmsg', 'Plan saved');
    } catch (e) { setMsg('pmsg', 'Not saved: ' + e.message, true); }
    $('savePlan').disabled = false;
  };

  // ---------- Start ----------
  async function refresh() {
    try { render(await api('summary')); }
    catch (e) { if (!data) setMsg('msg', 'Couldn’t load: ' + e.message, true); }
  }
  function startApp(d) {
    $('setup').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('month').textContent = new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    if (d) render(d); else { render(data); refresh(); }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg) refresh(); });

  if (cfg) startApp(); else showSetup();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
